name: CI

on:
  push:
    branches: ["main", "production", "coinbase-hardening-20261005", "coinbase-local", "fix/coinbase-agent-state-reconcile-eth"]
  pull_request:
    branches: ["main", "production", "coinbase-local"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests

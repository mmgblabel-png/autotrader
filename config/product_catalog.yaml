catalog:
  market: "United States"
  language: "en-US"
  channels: [blog, social, landing_page]
  shared_prohibited_claims:
    - "Do not state a price, discount, stock level, delivery date, sales rank, review count, star rating, or commission rate in public content."
    - "Do not make health, medical, safety, therapeutic, product-outcome, or conversion-rate claims."
    - "Do not cloak, shorten, append parameters to, or route traffic through an Amazon Associates Special Link."
    - "Do not use email, SMS/MMS, offline material, paid-search routing to Amazon, unsolicited messages, or unverified community channels."
    - "Do not copy customer reviews, create testimonials, manufacture urgency, or invent scarcity."

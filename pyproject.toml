[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "Automaton AutoTrader – modular automated trading agent"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "httpx>=0.27"]
live = ["polymarket-client>=0.1.0"]

[project.scripts]
autotrader = "autotrader.cli.main:main"
autotrader-bitvavo-security = "autotrader.core.bitvavo_security:main"
autotrader-reconcile-bitvavo = "autotrader.reconcile_cli:main"

[tool.setuptools.packages.find]
where = ["."]

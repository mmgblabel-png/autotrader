[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paypro-campaign-automaton"
version = "1.0.0"
description = "Approval-gated AI campaign runtime for ethical PayPro affiliate marketing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Manus AI" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "openai>=1.66,<3",
    "httpx>=0.28,<1",
    "croniter>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[project.scripts]
campaign-automaton = "campaign_automaton.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["campaign_automaton*"]

[tool.setuptools.package-data]
campaign_automaton = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "Automaton AutoTrader – modular automated trading agent"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "httpx>=0.27"]

[project.scripts]
autotrader = "autotrader.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]

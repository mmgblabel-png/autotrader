    max_consecutive_errors: 5

  sniper:
    enabled: true
    live_capable: true
    allocation_eur: 10
    max_order_eur: 7
    max_open_orders: 1
    exclusive_symbol: true
    symbol: XRP-EUR
    exchange: bitvavo
    order_value_eur: 6.0
    order_size: 0.0
    momentum_pct: 0.5
    take_profit_pct: 1.0
    stop_loss_pct: 0.3

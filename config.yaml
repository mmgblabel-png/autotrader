coinbase_zscore_shadow:
  enabled: true
  product_id: BTC-EUR
  durations_seconds: [300, 900, 1800, 3600]
  interval_seconds: 5
  volatility_lookback_seconds: 3600
  drift_lookback_seconds: 60
  min_vol_observations: 12
  min_sigma_annual: 0.10
  max_sigma_annual: 3.00
  min_seconds_to_window_end: 20
  strike_capture_grace_seconds: 45
  min_probability_long: 0.58
  max_entry_reference_z: 2.5
  max_forecast_z: 3.0
  # Current Coinbase Intro taker fee is 0.50% (=50 bps) per market-order leg.
  # Live execution still verifies the authenticated preview before every order.
  # Spread is modeled separately by ask entry / bid exit.
  fee_bps_each_leg: 50
  slippage_bps_each_leg: 5
  safety_margin_bps: 5
  min_after_cost_edge_bps: 10
  shadow_capital_eur: 80
  position_fraction: 0.05
  max_total_shadow_exposure_pct: 20
  min_notional_eur: 1
  max_notional_eur: 5
  state_path: /data/coinbase_zscore_shadow.json
  status_path: /data/coinbase_zscore_status.json
  # Fast-safe canary evidence: fewer forward samples than the old 300-trade
  # gate, offset by stricter quality and drawdown requirements.
  promotion_min_settled_trades: 30
  promotion_min_winrate_pct: 51.0
  promotion_min_net_pnl_eur: 0.05
  promotion_min_profit_factor: 1.15
  promotion_max_drawdown_pct: 5.0


coinbase_autonomous_execution:
  enabled: true
  product_id: BTC-EUR
  supported_products: [BTC-EUR, BTC-USDC]
  # Set COINBASE_AGENT_PORTFOLIO_ID to an isolated Advanced portfolio UUID.
  # Empty keeps current default-portfolio behavior until that portfolio/key is provisioned.
  portfolio_id: ""
  require_isolated_portfolio: true
  allow_existing_btc_seed: false
  interval_seconds: 5
  # Only this sleeve is controlled by the Coinbase agent. Remaining BTC is not
  # adopted as bot inventory.
  # The entire isolated Coinbase Agent portfolio is agent-owned capital.
  # Exposure is still bounded independently by max_single_trade_pct and the cash reserve.
  managed_capital_pct: 100.0
  cash_reserve_pct: 20.0
  max_single_trade_pct: 20.0
  # In full-capacity mode max_order_eur is not an extra cap; the hard 20%
  # single-position rule and available isolated quote balance determine sizing.
  max_order_eur: 5.0
  min_order_eur: 1.0
  full_capacity: true
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 10.0
  stop_loss_pct: 1.0
  take_profit_pct: 1.5
  max_preview_fee_bps: 60.0
  max_preview_slippage_bps: 25.0
  assumed_exit_fee_bps: 50.0
  min_live_net_edge_bps: 8.0
  max_spread_bps: 20.0
  trailing_activate_pct: 0.8
  trailing_stop_pct: 0.5
  # RiskTrader does not wait for a shadow-promotion quota. Each live setup is
  # gated by current forecast edge, authenticated preview fees/slippage, spread,
  # portfolio risk, daily loss and drawdown.
  require_shadow_promotion: false
  state_path: /data/coinbase_autonomous_canary.json

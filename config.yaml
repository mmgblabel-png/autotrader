# AutoTrader – safe Bitvavo defaults
export_dir: exports

fund:
  enabled: true
  fund_id: autotrader-personal-fund
  base_currency: EUR
  initial_nav_eur: 50
  target_nav_eur: 100000
  protected_capital_floor_eur: 25000
  lock_floor_after_target_reached: true
  capital_floor_buffer_pct: 2.0
  live_nav_max_age_seconds: 120
  ledger_path: data/fund_ledger.sqlite3
  max_portfolio_drawdown_pct: 10.0
  max_daily_loss_pct: 3.0
  max_single_trade_pct: 20.0
  max_gross_exposure_pct: 80.0
  max_strategy_exposure_pct: 40.0
  max_asset_exposure_pct: 20.0
  min_cash_reserve_pct: 20.0
  min_signal_confidence: 0.62
  signal_half_life_seconds: 900
  signal_buffer_size: 5000
  track_record_min_days: 365
  track_record_min_fills: 100
  agent_weights:
    market_research: 1.0
    trend_detection: 1.0
    onchain_analysis: 1.0
    whale_tracking: 1.0
    sentiment: 1.0
    risk: 1.25
    portfolio_allocation: 1.1

research_lab:
  enabled: true
  initial_equity_eur: 100
  allocation_pct: 25
  max_candles: 1440
  min_history: 30
  trend_fast: 10
  trend_slow: 30
  momentum_lookback: 12
  mean_reversion_lookback: 20
  mean_reversion_entry_z: 1.5
  walk_forward_window: 180
  walk_forward_purge_bars: 6
  walk_forward_embargo_bars: 2
  monte_carlo_simulations: 10000
  monte_carlo_horizon_periods: 365
  monte_carlo_block_size: 5
  monte_carlo_seed: 42
  ruin_drawdown_pct: 30.0

portfolio:
  # Historical seed capital was €50; live capital management starts from €80.
  initial_live_capital_eur: 80
  global_live_budget_eur: 80
  dynamic_with_verified_nav: true
  max_deployable_pct: 80.0
  min_cash_reserve_pct: 20.0
  max_total_open_orders: 4

portfolio_goal:
  enabled: true
  starting_equity_eur: 80
  target_equity_eur: 100000
  target_days: 365
  milestones_eur:
    - 250
    - 500
    - 1000
    - 5000
    - 10000
    - 50000
    - 100000
  goal_is_risk_input: false
  increase_risk_to_catch_up: false

binance_reference:
  enabled: true
  symbol: BTCUSDT
  interval_seconds: 1
  timeout_seconds: 3

leverage_martingale_risk_lab:
  enabled: false
  path: /data/leverage_martingale_lab.json
  symbol: BTC-EUR
  starting_equity_eur: 50
  base_stake_eur: 3
  max_stake_eur: 8
  leverage: 1.0
  martingale_multiplier: 1.0
  max_martingale_steps: 0
  momentum_trigger_pct: 0.20
  take_profit_pct: 0.75
  stop_loss_pct: 0.45
  fee_pct_each_leg: 0.25
  slippage_pct_each_leg: 0.05
  live_capable: false
  live_orders_sent: false

adaptive_learning:
  enabled: true
  path: /data/adaptive_learning.json
  min_samples: 6
  lookback: 24
  evaluation_window: 5
  change_cooldown: 3
  rollback_cooldown_exits: 12
  good_winrate_pct: 62.0
  max_regression_pct: 20.0

shadow_lab:
  enabled: true
  path: /data/shadow_strategies.json
  interval_seconds: 5
  fee_pct_each_leg: 0.25
  slippage_pct_each_leg: 0.05
  promotion_min_completed_trades: 24
  promotion_min_winrate_pct: 55.0
  promotion_min_net_pnl_eur: 0.15
  promotion_min_profit_factor: 1.10
  promotion_min_q10_return_pct: -2.50
  promotion_cost_stress_multiplier: 1.25
  promotion_max_drawdown_pct: 6.0
  canary_min_completed_trades: 12
  canary_min_winrate_pct: 52.0
  canary_min_net_pnl_eur: 0.10
  canary_min_profit_factor: 1.05
  canary_min_q10_return_pct: -3.50
  canary_max_drawdown_pct: 5.0
  drift_gate_enabled: true
  drift_min_samples: 80
  drift_baseline_bars: 120
  drift_recent_bars: 40
  drift_max_mean_shift_sigma: 2.5
  drift_max_vol_ratio: 2.5
  dynamic_markets_per_strategy: 16
  backfill_candles: 120
  backfill_interval: 1m
  strategies:
    mean_reversion:
      enabled: true
      kind: mean_reversion
      strategy_version: v2
      symbol: ETH-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      lookback: 40
      entry_z: 2.0
      entry_rebound_pct: 0.08
      max_downtrend_pct: 1.20
      exit_z: -0.05
      min_exit_net_pct: 0.75
      take_profit_pct: 1.35
      stop_loss_pct: 1.20
    volatility_breakout:
      enabled: true
      kind: volatility_breakout
      strategy_version: v3
      symbol: ADA-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      lookback: 30
      breakout_buffer_pct: 0.16
      min_avg_move_pct: 0.03
      min_vol_expansion_ratio: 1.08
      max_entry_spike_pct: 1.25
      min_exit_net_pct: 0.75
      take_profit_pct: 1.5
      stop_loss_pct: 0.75
      trailing_exit_pct: 0.45
    sniper_v2:
      enabled: true
      kind: sniper_v2
      strategy_version: v2
      symbol: XRP-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      ema_fast: 6
      ema_slow: 18
      momentum_lookback: 3
      momentum_pct: 0.22
      max_entry_spike_pct: 0.90
      min_exit_net_pct: 0.75
      take_profit_pct: 1.10
      stop_loss_pct: 0.45
      trailing_exit_pct: 0.35

allocator_v2:
  enabled: true
  apply_live: false
  min_samples: 12
  max_shift_pct: 25.0
  min_allocation_eur: 5.0
  fee_drag_penalty_pct: 50.0
  idle_budget_reuse_pct: 50.0

execution_v2:
  enabled: true
  apply_live: true
  # Preserve maker queue position unless quality or fill probability has
  # materially degraded. Broad-market routing may fluctuate from tick to tick.
  stale_after_seconds: 180
  buy_stale_after_seconds: 300
  buy_max_order_age_seconds: 900
  buy_refresh_tolerance_bps: 15.0
  opportunity_switch_score_delta: 6.0
  opportunity_switch_confirm_seconds: 180
  post_cancel_entry_cooldown_seconds: 90
  market_switch_cancel_cooldown_seconds: 30
  # Risk-reducing exits behave like hanging orders: keep them live while their
  # price remains competitive and profitable.
  sell_stale_after_seconds: 600
  sell_max_order_age_seconds: 1800
  sell_refresh_tolerance_bps: 12.0
  manage_interval_seconds: 15
  cancel_retry_seconds: 60
  auth_cancel_retry_seconds: 900
  min_reprice_move_bps: 10.0
  order_refresh_tolerance_bps: 10.0
  max_order_age_seconds: 900
  filled_order_delay_seconds: 75

live_evidence_gate:
  enabled: true
  min_completed_exits: 4
  minimum_net_pnl_eur: 0.00
  recovery_enabled: true
  recovery_strategies:
    - GridRunner
    - GridRunnerETH
    - MarketMaker
    - SniperBot
  recovery_order_eur: 5.50
  recovery_cooldown_seconds: 300
  recovery_min_score: 85.0
  recovery_min_confidence: 0.62
  recovery_min_signal_strength: 62.0
  recovery_min_winrate_pct: 45.0
  recovery_max_net_deficit_eur: 0.75

calculated_risk:
  enabled: true
  profile: balanced_aggressive
  min_confidence: 0.62
  max_size_multiplier: 1.35
  max_drawdown_pct: 8.0
  max_fee_drag_pct: 55.0
  # This payload is consumed by AutonomousDecisionEngine for bounded sizing.
  # It cannot raise max_order_eur, global budget, leverage, or armed state.
  apply_live: true
  allow_leverage: false
  allow_martingale: false
  allow_budget_increase: false

autonomous_execution:
  enabled: true
  apply_live: true
  min_score: 85.0
  instrument_scope: spot_only
  allow_margin: false
  allow_futures: false
  allow_borrowing: false
  min_confidence: 0.62
  min_signal_strength: 62.0
  minimum_live_order_eur: 5.5
  max_size_score: 90.0
  high_volatility_bps: 180.0
  high_volatility_size_multiplier: 0.65
  max_size_confidence: 0.70
  exposure_safety_buffer_eur: 0.10
  switch_cooldown_seconds: 30
  strategy_markets:
    market_maker:
      - "*"
    grid:
      - "*"
    grid_eth:
      - "*"
    sniper:
      - "*"
    shadow_canary:
      - "*"
  market_thresholds:
    PEPE-EUR:
      min_score: 74.0
      min_confidence: 0.66
    NEX-EUR:
      min_score: 78.0
      min_confidence: 0.70
    BILL-EUR:
      min_score: 78.0
      min_confidence: 0.70
  can_arm_itself: false
  can_raise_global_budget: false
  can_raise_hard_risk_limits: false
  allow_leverage: false
  allow_martingale: false
  allow_non_eur_live: true

autonomous_fund:
  enabled: true
  research_interval_seconds: 3600
  research_top_markets: 5
  research_interval: 1h
  research_strategy: multi_factor
  research_candle_limit: 720

    max_position_size: 500.0
    max_slippage_pct: 0.5
    max_consecutive_errors: 5

  arbitrage:
    enabled: false
    live_capable: false
    allocation_eur: 10
    max_order_eur: 7
    max_open_orders: 2
    exclusive_symbol: true
    symbol: ETH-EUR
    exchanges: []
    order_size: 0.01

# AutoTrader – safe Bitvavo defaults
export_dir: exports

portfolio:
  global_live_budget_eur: 50
  max_total_open_orders: 4

portfolio_goal:
  enabled: true
  starting_equity_eur: 50
  target_equity_eur: 25000
  target_days: 365
  milestones_eur:
    - 100
    - 250
    - 500
    - 1000
    - 2500
    - 5000
    - 10000
    - 25000
  goal_is_risk_input: false
  increase_risk_to_catch_up: false

binance_reference:
  enabled: true
  symbol: BTCUSDT
  interval_seconds: 1
  timeout_seconds: 3

leverage_martingale_risk_lab:
  enabled: true
  path: /data/leverage_martingale_lab.json
  symbol: BTC-EUR
  starting_equity_eur: 50
  base_stake_eur: 3
  max_stake_eur: 8
  leverage: 2.0
  martingale_multiplier: 1.35
  max_martingale_steps: 2
  momentum_trigger_pct: 0.20
  take_profit_pct: 0.75
  stop_loss_pct: 0.45
  fee_pct_each_leg: 0.25
  slippage_pct_each_leg: 0.05
  live_capable: false
  live_orders_sent: false

adaptive_learning:
  enabled: true
  path: /data/adaptive_learning.json
  min_samples: 8
  lookback: 24
  evaluation_window: 6
  change_cooldown: 4
  good_winrate_pct: 62.0
  max_regression_pct: 20.0

shadow_lab:
  enabled: true
  path: /data/shadow_strategies.json
  interval_seconds: 5
  fee_pct_each_leg: 0.25
  slippage_pct_each_leg: 0.05
  promotion_min_completed_trades: 24
  promotion_min_winrate_pct: 55.0
  promotion_min_net_pnl_eur: 0.15
  promotion_min_profit_factor: 1.10
  promotion_cost_stress_multiplier: 1.25
  promotion_max_drawdown_pct: 6.0
  dynamic_markets_per_strategy: 12
  backfill_candles: 120
  backfill_interval: 1m
  strategies:
    mean_reversion:
      enabled: true
      kind: mean_reversion
      strategy_version: v2
      symbol: ETH-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      lookback: 40
      entry_z: 2.0
      entry_rebound_pct: 0.08
      max_downtrend_pct: 1.20
      exit_z: -0.05
      min_exit_net_pct: 0.75
      take_profit_pct: 1.35
      stop_loss_pct: 1.20
    volatility_breakout:
      enabled: true
      kind: volatility_breakout
      strategy_version: v2
      symbol: ADA-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      lookback: 30
      breakout_buffer_pct: 0.16
      min_avg_move_pct: 0.03
      min_vol_expansion_ratio: 1.08
      max_entry_spike_pct: 1.25
      min_exit_net_pct: 0.75
      take_profit_pct: 1.5
      stop_loss_pct: 0.75
      trailing_exit_pct: 0.45
    sniper_v2:
      enabled: true
      kind: sniper_v2
      strategy_version: v1
      symbol: XRP-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      ema_fast: 6
      ema_slow: 18
      momentum_lookback: 3
      momentum_pct: 0.22
      max_entry_spike_pct: 0.90
      min_exit_net_pct: 0.75
      take_profit_pct: 1.10
      stop_loss_pct: 0.45
      trailing_exit_pct: 0.35

allocator_v2:
  enabled: true
  apply_live: false
  min_samples: 12
  max_shift_pct: 25.0
  min_allocation_eur: 5.0
  fee_drag_penalty_pct: 50.0
  idle_budget_reuse_pct: 50.0

execution_v2:
  enabled: true
  apply_live: true
  stale_after_seconds: 90
  manage_interval_seconds: 15
  min_reprice_move_bps: 4.0
  order_refresh_tolerance_bps: 4.0
  max_order_age_seconds: 300
  filled_order_delay_seconds: 60

calculated_risk:
  enabled: true
  profile: balanced_aggressive
  min_confidence: 0.62
  max_size_multiplier: 1.35
  max_drawdown_pct: 8.0
  max_fee_drag_pct: 55.0
  apply_live: false
  allow_leverage: false
  allow_martingale: false
  allow_budget_increase: false

autonomous_execution:
  enabled: true
  apply_live: true
  min_score: 68.0
  min_confidence: 0.62
  min_signal_strength: 62.0
  minimum_live_order_eur: 5.0
  max_size_score: 82.0
  max_size_confidence: 0.75
  exposure_safety_buffer_eur: 0.10
  switch_cooldown_seconds: 90
  strategy_markets:
    market_maker:
      - "*"
    grid:
      - "*"
    grid_eth:
      - "*"
    sniper:
      - "*"
  market_thresholds:
    PEPE-EUR:
      min_score: 74.0
      min_confidence: 0.66
    NEX-EUR:
      min_score: 78.0
      min_confidence: 0.70
    BILL-EUR:
      min_score: 78.0
      min_confidence: 0.70
  can_arm_itself: false
  can_raise_global_budget: false
  can_raise_hard_risk_limits: false
  allow_leverage: false
  allow_martingale: false
  allow_non_eur_live: false

market_universe:
  enabled: true
  refresh_seconds: 300
  coinbase_book_batch_size: 30
  max_bridge_hops: 3
  min_top_depth_eur: 25
  max_spread_bps: 50

opportunity_router:
  enabled: true
  interval_seconds: 10
  history_size: 48
  min_top_depth_eur: 25
  max_spread_bps: 35
  probe_order_eur: 6
  max_snapshot_age_seconds: 30
  auto_discover_eur: true
  auto_discover_all: true
  max_markets: 500
  discovery_refresh_seconds: 300
  markets:
    - BTC-EUR
    - ETH-EUR
    - SOL-EUR
    - XRP-EUR
    - ADA-EUR
    - LINK-EUR
    - DOGE-EUR
    - PEPE-EUR
    - NEX-EUR
    - BILL-EUR
    - NEAR-EUR
    - AVAX-EUR
    - HBAR-EUR
    - SUI-EUR
    - XLM-EUR
    - AAVE-EUR
    - ALGO-EUR
    - ONDO-EUR
    - FET-EUR
    - DOT-EUR
    - LTC-EUR
    - BCH-EUR
    - UNI-EUR
    - HYPE-EUR
    - QNT-EUR

profit_policy:
  estimated_entry_fee_pct: 0.25
  estimated_exit_fee_pct: 0.25
  estimated_slippage_each_leg_pct: 0.05
  min_expected_net_edge_pct: 0.15
  use_live_fee_tier_for_route_gates: true

strategies:
  market_maker:
    enabled: true
    live_capable: true
    allocation_eur: 18
    max_order_eur: 12
    max_open_orders: 1
    exclusive_symbol: true
    symbol: BTC-EUR
    exchange: bitvavo
    order_value_eur: 6.0
    order_size: 0.0001
    min_order_size: 0.00000001
    max_order_size: 1000000000
    target_spread: 0.80
    quote_refresh_seconds: 5
    cycle_cooldown_seconds: 60
    adaptive_enabled: true
    adaptive_ema_alpha: 0.18
    adaptive_min_samples: 6
    adaptive_min_spread_pct: 0.65
    adaptive_max_spread_pct: 1.50
    adaptive_volatility_multiplier: 4.0
    adaptive_downtrend_guard_pct: 0.12
    inventory_target: 0.0
    inventory_cycle_mode: true
    cycle_exit_markup_pct: 0.80
    inventory_skew_pct: 0.10
    estimated_fee_pct: 0.25
    estimated_slippage_pct: 0.05
    max_daily_loss: 20.0
    max_position_size: 500.0
    max_slippage_pct: 0.5
    max_consecutive_errors: 5

  arbitrage:
    enabled: false
    live_capable: false
    allocation_eur: 10
    max_order_eur: 7
    max_open_orders: 2
    exclusive_symbol: true
    symbol: ETH-EUR
    exchanges: []
    order_size: 0.01
    max_order_size: 0.1
    min_profit_pct: 0.40
    estimated_fee_pct: 0.25
    min_edge_after_costs_pct: 0.10
    max_daily_loss: 30.0
    max_position_size: 1000.0
    max_slippage_pct: 0.3
    max_consecutive_errors: 3

  grid:
    enabled: true
    live_capable: true
    allocation_eur: 10
    max_order_eur: 9
    max_open_orders: 1
    exclusive_symbol: true
    symbol: SOL-EUR
    exchange: bitvavo
    order_value_eur: 6.0
    order_size: 0.0
    entry_offset_pct: 0.60
    exit_markup_pct: 0.80
    cycle_cooldown_seconds: 60
    failure_cooldown_seconds: 15
    allocation_failure_cooldown_seconds: 5
    max_daily_loss: 25.0
    max_position_size: 300.0
    max_slippage_pct: 0.5
    max_consecutive_errors: 5

  grid_eth:
    enabled: true
    live_capable: true
    strategy_name: GridRunnerETH
    allocation_eur: 10
    max_order_eur: 9
    max_open_orders: 1
    exclusive_symbol: true
    symbol: ETH-EUR
    exchange: bitvavo
    order_value_eur: 6.0
    order_size: 0.0
    entry_offset_pct: 0.60
    exit_markup_pct: 0.80
    cycle_cooldown_seconds: 60
    failure_cooldown_seconds: 15
    allocation_failure_cooldown_seconds: 5
    max_daily_loss: 20.0
    max_position_size: 300.0
    max_slippage_pct: 0.5
    max_consecutive_errors: 5

  sniper:
    enabled: true
    live_capable: true
    allocation_eur: 12
    max_order_eur: 10
    max_open_orders: 1
    exclusive_symbol: true
    symbol: XRP-EUR
    exchange: bitvavo
    order_value_eur: 6.0
    order_size: 0.0
    momentum_pct: 0.5
    take_profit_pct: 1.5
    stop_loss_pct: 0.35
    cooldown_seconds: 600
    autonomous_min_score: 82
    autonomous_min_signal_strength: 80
    autonomous_min_confidence: 0.75
    ema_fast: 9
    ema_slow: 21
    max_slippage_pct: 0.12
    max_daily_loss: 0.25
    max_position_size: 200.0
    max_consecutive_errors: 3

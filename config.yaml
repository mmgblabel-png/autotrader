    max_consecutive_errors: 3

  grid:
    enabled: true
    live_capable: true
    allocation_eur: 15
    max_order_eur: 7
    max_open_orders: 1
    exclusive_symbol: true
    symbol: SOL-EUR
    exchange: bitvavo
    order_value_eur: 6.0
    order_size: 0.0
    entry_offset_pct: 0.60
    exit_markup_pct: 0.80
    max_daily_loss: 25.0
    max_position_size: 300.0

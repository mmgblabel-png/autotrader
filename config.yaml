# AutoTrader – main configuration file
# Copy this file to config.yaml and adjust values before running.

# Where to write PnL export files
export_dir: exports

strategies:

  # ── Market Maker ──────────────────────────────────────────────────────
  market_maker:
    symbol: BTC/USDT
    exchange: binance
    order_size: 0.001          # base-asset quantity per order
    min_order_size: 0.0001
    max_order_size: 0.01
    target_spread: 0.20        # spread in %, e.g. 0.20 = 0.20%
    max_daily_loss: 20.0       # USD
    max_position_size: 500.0   # USD notional
    max_slippage_pct: 0.5
    max_consecutive_errors: 5

  # ── Arbitrage Hunter ──────────────────────────────────────────────────
  arbitrage:
    symbol: ETH/USDT
    exchanges:
      - binance
      - kraken
      - coinbase
    order_size: 0.01
    max_order_size: 0.1
    min_profit_pct: 0.15       # minimum net profit % to trigger trade
    max_daily_loss: 30.0
    max_position_size: 1000.0
    max_slippage_pct: 0.3
    max_consecutive_errors: 3

  # ── Grid Runner ────────────────────────────────────────────────────────
  grid:
    symbol: SOL/USDT
    exchange: binance
    upper_price: 110.0
    lower_price: 90.0
    grid_levels: 10
    order_size: 1.0            # SOL per grid level
    max_daily_loss: 25.0
    max_position_size: 300.0
    max_slippage_pct: 0.5
    max_consecutive_errors: 5

  # ── Sniper Bot ────────────────────────────────────────────────────────
  sniper:
    symbol: BTC/USDT
    exchange: binance
    order_size: 0.001
    momentum_pct: 0.5          # % price move to trigger entry
    take_profit_pct: 1.0       # exit at +1%
    stop_loss_pct: 0.3         # exit at -0.3%
    max_slippage_pct: 0.2
    max_daily_loss: 15.0
    max_position_size: 200.0
    max_consecutive_errors: 3

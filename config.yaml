# AutoTrader – safe Bitvavo defaults
export_dir: exports

fund:
  enabled: true
  fund_id: autotrader-personal-fund
  base_currency: EUR
  initial_nav_eur: 50
  target_nav_eur: 25000
  protected_capital_floor_eur: 25000
  lock_floor_after_target_reached: true
  capital_floor_buffer_pct: 2.0
  live_nav_max_age_seconds: 120
  ledger_path: data/fund_ledger.sqlite3
  max_portfolio_drawdown_pct: 8.0
  max_daily_loss_pct: 2.0
  max_single_trade_pct: 20.0
  max_gross_exposure_pct: 85.0
  max_strategy_exposure_pct: 40.0
  max_asset_exposure_pct: 35.0
  min_cash_reserve_pct: 15.0
  min_signal_confidence: 0.62
  signal_half_life_seconds: 900
  signal_buffer_size: 5000
  growth_plan:
    enabled: true
    auto_scale_live_budget: true
    minimum_live_order_eur: 5.0
    track_record:
      min_elapsed_days: 365
      min_observation_days: 250
      min_completed_exits: 200
      min_net_realized_pnl_eur: 0.01
      min_profit_factor: 1.10
      min_sharpe: 0.50
      max_drawdown_pct: 8.0
    governance:
      investor_capital_enabled: false
      legal_structure_confirmed: false
      compliance_review_confirmed: false
      accounting_review_confirmed: false
      external_audit_confirmed: false
    stages:
      - key: seed
        label: "€50 → €500"
        min_nav_eur: 0
        next_nav_eur: 500
        deployable_pct: 40
        max_order_eur: 6
        max_open_orders: 2
        max_portfolio_drawdown_pct: 6.0
        max_daily_loss_pct: 1.5
        max_single_trade_pct: 12.0
        max_gross_exposure_pct: 40
        max_strategy_exposure_pct: 20
        max_asset_exposure_pct: 20
        max_sector_exposure_pct: 30
        min_cash_reserve_pct: 60
      - key: emerging
        label: "€500 → €5.000"
        min_nav_eur: 500
        next_nav_eur: 5000
        deployable_pct: 50
        max_order_eur: 20
        max_open_orders: 4
        max_portfolio_drawdown_pct: 6.5
        max_daily_loss_pct: 1.5
        max_single_trade_pct: 4.0
        max_gross_exposure_pct: 50
        max_strategy_exposure_pct: 22.5
        max_asset_exposure_pct: 20
        max_sector_exposure_pct: 30
        min_cash_reserve_pct: 50
      - key: scaled
        label: "€5.000 → €50.000"
        min_nav_eur: 5000
        next_nav_eur: 50000
        deployable_pct: 60
        max_order_eur: 100
        max_open_orders: 6
        max_portfolio_drawdown_pct: 7.0
        max_daily_loss_pct: 1.5
        max_single_trade_pct: 2.0
        max_gross_exposure_pct: 60
        max_strategy_exposure_pct: 20
        max_asset_exposure_pct: 15
        max_sector_exposure_pct: 25
        min_cash_reserve_pct: 40
      - key: institutional_personal
        label: "€50.000+ / Track Record"
        min_nav_eur: 50000
        next_nav_eur:
        deployable_pct: 65
        max_order_eur: 250
        max_open_orders: 8
        max_portfolio_drawdown_pct: 8.0
        max_daily_loss_pct: 1.25
        max_single_trade_pct: 0.5
        max_gross_exposure_pct: 65
        max_strategy_exposure_pct: 20
        max_asset_exposure_pct: 12.5
        max_sector_exposure_pct: 20
        min_cash_reserve_pct: 35
  portfolio_allocation:
    default_sector_cap_pct: 30
    unknown_sector_cap_pct: 10
    sector_caps_pct:
      bitcoin: 30
      layer1: 30
      payments: 20
      oracle_infrastructure: 20
      defi: 20
      rwa: 15
      ai_data: 15
      gaming_metaverse: 10
      meme_speculative: 8
      trading_infrastructure: 15
      other: 10
    sector_map:
      BTC: bitcoin
      ETH: layer1
      SOL: layer1
      ADA: layer1
      NEAR: layer1
      AVAX: layer1
      SUI: layer1
      HBAR: layer1
      ALGO: layer1
      DOT: layer1
      XRP: payments
      XLM: payments
      LTC: payments
      BCH: payments
      LINK: oracle_infrastructure
      QNT: oracle_infrastructure
      AAVE: defi
      UNI: defi
      RSR: defi
      ONDO: rwa
      FET: ai_data
      MANA: gaming_metaverse
      DOGE: meme_speculative
      PEPE: meme_speculative
      HYPE: trading_infrastructure
      NEX: other
      BILL: other
  agent_weights:
    market_research: 1.0
    trend_detection: 1.0
    onchain_analysis: 0.9
    whale_tracking: 0.8
    sentiment: 0.7
    risk: 1.25
    portfolio_allocation: 1.1

research_lab:
  enabled: true
  initial_equity_eur: 100
  allocation_pct: 25
  max_candles: 1440
  min_history: 30
  trend_fast: 10
  trend_slow: 30
  momentum_lookback: 12
  mean_reversion_lookback: 20
  mean_reversion_entry_z: 1.5
  walk_forward_window: 180
  monte_carlo_simulations: 10000
  monte_carlo_horizon_periods: 365
  monte_carlo_block_size: 5
  monte_carlo_seed: 42
  ruin_drawdown_pct: 30.0

portfolio:
  global_live_budget_eur: 50
  max_total_open_orders: 4

portfolio_goal:
  enabled: true
  starting_equity_eur: 50
  target_equity_eur: 50000
  target_days: 1825
  milestones_eur:
    - 50
    - 500
    - 5000
    - 25000
    - 50000
  goal_is_risk_input: false
  increase_risk_to_catch_up: false

binance_reference:
  enabled: true
  symbol: BTCUSDT
  interval_seconds: 1
  timeout_seconds: 3

leverage_martingale_risk_lab:
  enabled: true
  path: /data/leverage_martingale_lab.json
  symbol: BTC-EUR
  starting_equity_eur: 50
  base_stake_eur: 3
  max_stake_eur: 8
  leverage: 2.0
  martingale_multiplier: 1.35
  max_martingale_steps: 2
  momentum_trigger_pct: 0.20
  take_profit_pct: 0.75
  stop_loss_pct: 0.45
  fee_pct_each_leg: 0.25
  slippage_pct_each_leg: 0.05
  live_capable: false
  live_orders_sent: false

adaptive_learning:
  enabled: true
  path: /data/adaptive_learning.json
  min_samples: 8
  lookback: 24
  evaluation_window: 6
  change_cooldown: 4
  rollback_cooldown_exits: 12
  good_winrate_pct: 62.0
  max_regression_pct: 20.0

shadow_lab:
  enabled: true
  path: /data/shadow_strategies.json
  interval_seconds: 5
  fee_pct_each_leg: 0.25
  slippage_pct_each_leg: 0.05
  promotion_min_completed_trades: 24
  promotion_min_winrate_pct: 55.0
  promotion_min_net_pnl_eur: 0.15
  promotion_min_profit_factor: 1.10
  promotion_cost_stress_multiplier: 1.25
  promotion_max_drawdown_pct: 6.0
  dynamic_markets_per_strategy: 12
  backfill_candles: 120
  backfill_interval: 1m
  strategies:
    mean_reversion:
      enabled: true
      kind: mean_reversion
      strategy_version: v2
      symbol: ETH-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      lookback: 40
      entry_z: 2.0
      entry_rebound_pct: 0.08
      max_downtrend_pct: 1.20
      exit_z: -0.05
      min_exit_net_pct: 0.75
      take_profit_pct: 1.35
      stop_loss_pct: 1.20
    volatility_breakout:
      enabled: true
      kind: volatility_breakout
      strategy_version: v3
      symbol: ADA-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      lookback: 30
      breakout_buffer_pct: 0.16
      min_avg_move_pct: 0.03
      min_vol_expansion_ratio: 1.08
      max_entry_spike_pct: 1.25
      min_exit_net_pct: 0.75
      take_profit_pct: 1.5
      stop_loss_pct: 0.75
      trailing_exit_pct: 0.45
    sniper_v2:
      enabled: true
      kind: sniper_v2
      strategy_version: v2
      symbol: XRP-EUR
      exchange: bitvavo
      shadow_order_eur: 6.0
      ema_fast: 6
      ema_slow: 18
      momentum_lookback: 3
      momentum_pct: 0.22
      max_entry_spike_pct: 0.90
      min_exit_net_pct: 0.75
      take_profit_pct: 1.10
      stop_loss_pct: 0.45
      trailing_exit_pct: 0.35

allocator_v2:
  enabled: true
  apply_live: false
  min_samples: 12
  max_shift_pct: 25.0
  min_allocation_eur: 5.0
  fee_drag_penalty_pct: 50.0
  idle_budget_reuse_pct: 50.0

execution_v2:
  enabled: true
  apply_live: true
  # Preserve maker queue position unless quality or fill probability has
  # materially degraded. Broad-market routing may fluctuate from tick to tick.
  stale_after_seconds: 180
  buy_stale_after_seconds: 180
  buy_max_order_age_seconds: 900
  buy_refresh_tolerance_bps: 10.0
  opportunity_switch_score_delta: 5.0
  opportunity_switch_confirm_seconds: 120
  # Risk-reducing exits behave like hanging orders: keep them live while their
  # price remains competitive and profitable.
  sell_stale_after_seconds: 600
  sell_max_order_age_seconds: 1800
  sell_refresh_tolerance_bps: 12.0
  manage_interval_seconds: 15
  cancel_retry_seconds: 60
  auth_cancel_retry_seconds: 900
  min_reprice_move_bps: 10.0
  order_refresh_tolerance_bps: 10.0
  max_order_age_seconds: 900
  filled_order_delay_seconds: 75

live_evidence_gate:
  enabled: true
  min_completed_exits: 4
  minimum_net_pnl_eur: -0.10

calculated_risk:
  enabled: true
  profile: balanced_aggressive
  min_confidence: 0.62
  max_size_multiplier: 1.35
  max_drawdown_pct: 8.0
  max_fee_drag_pct: 55.0
  # This payload is consumed by AutonomousDecisionEngine for bounded sizing.
  # It cannot raise max_order_eur, global budget, leverage, or armed state.
  apply_live: true
  allow_leverage: false
  allow_martingale: false
  allow_budget_increase: false

autonomous_execution:
  enabled: true
  apply_live: true
  min_score: 68.0
  min_confidence: 0.62
  min_signal_strength: 62.0
  minimum_live_order_eur: 5.0
  max_size_score: 82.0
  max_size_confidence: 0.75
  exposure_safety_buffer_eur: 0.10
  switch_cooldown_seconds: 90
  strategy_markets:
    market_maker:
      - "*"
    grid:
      - "*"
    grid_eth:
      - "*"
    sniper:
      - "*"
  market_thresholds:
    PEPE-EUR:
      min_score: 74.0
      min_confidence: 0.66
    NEX-EUR:
      min_score: 78.0
      min_confidence: 0.70
    BILL-EUR:
      min_score: 78.0
      min_confidence: 0.70
  can_arm_itself: false
  can_raise_global_budget: false
  can_raise_hard_risk_limits: false
  allow_leverage: false
  allow_martingale: false
  allow_non_eur_live: false

market_universe:
  enabled: true
  refresh_seconds: 300
  coinbase_book_batch_size: 30
  max_bridge_hops: 3
  min_top_depth_eur: 25
  max_spread_bps: 50

opportunity_router:

services:
  campaign-automaton:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - campaign-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  campaign-data:

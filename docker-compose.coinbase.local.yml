services:
  coinbase-risktrader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coinbase-risktrader-local
    entrypoint: ["/usr/local/bin/docker-entrypoint-coinbase-local.sh"]
    command:
      - sh
      - -c
      - exec python -m uvicorn autotrader.api.coinbase_local_server:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.coinbase.local
    environment:
      AUTOTRADER_CONFIG: /app/config.coinbase.local.yaml
      COINBASE_ARM_STATE_PATH: /data/coinbase_live_arm_state.json
      EXECUTION_MODE: live
      LIVE_EXECUTION_APPROVED: "true"
      COINBASE_EXECUTION_ADAPTER_INSTALLED: "true"
      COINBASE_LIVE_TRADING: "true"
      EMERGENCY_STOP: "false"
      LIVE_TRADING_CONFIRMATION: I_UNDERSTAND_LIVE_ORDERS
      COINBASE_ALLOW_EXISTING_BTC_SEED: "true"
      COINBASE_AUTO_ARM_ON_START: "true"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8787:8000"
    volumes:
      - coinbase-risktrader-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  coinbase-risktrader-data:
    name: coinbase-risktrader-data
